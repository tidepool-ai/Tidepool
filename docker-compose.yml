# Local services for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tidepool
      POSTGRES_PASSWORD: tidepool
      POSTGRES_DB: tidepool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidepool -d tidepool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
